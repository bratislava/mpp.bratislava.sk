name: Build
# Runs on every PR against master: dockerized validation, tests, lint and
# format for both services, plus a no-push build of the frontend image. The
# same reusable workflows run in deploy mode (cluster set) from deploy.yml.
#
# Dependabot PRs wait for a manual approval on the `dependabot` environment
# (required reviewers) before anything builds: every build pushes a
# per-branch layer cache to Harbor, and unattended Dependabot PRs filled the
# Harbor namespace. Same pattern as konto.bratislava.sk.
on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  dependabot-approval:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dependabot
    steps:
      - name: Wait for approval
        run: echo "Approved to run CI for Dependabot PR"

  # The infra repo reads .env.deploy.<cluster> from this repo on every apply, and
  # build-frontend.yml reads .env.build.<cluster> at build time. PR CI only ever builds
  # the development one, so without this the other env files have no pre-merge guard at
  # all -- a missing or untracked one surfaces as a failed Terraform apply in a cluster.
  env-files:
    if: always() && (needs.dependabot-approval.result == 'success' || needs.dependabot-approval.result == 'skipped')
    needs: [dependabot-approval]
    name: Env Files
    runs-on: bratislava
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # The cluster list is duplicated in deploy.yml's `resolve` case statement and in
      # backend/src/config/configuration.spec.ts -- keep all three in step when it changes.
      - name: Every deploy and build env file is committed and non-empty
        run: |
          for c in development staging production; do
            for f in "backend/.env.deploy.$c" "frontend/.env.deploy.$c"; do
              git ls-files --error-unmatch "$f"
              test -s "$f" || { echo "::error file=$f::$f is empty"; exit 1; }
            done
          done
          # Next bakes this in at build time, and PR CI only ever builds the development
          # one, so assert the value is actually there rather than just the file.
          for c in development staging production; do
            f="frontend/.env.build.$c"
            git ls-files --error-unmatch "$f"
            grep -q '^NEXT_PUBLIC_API_URL=.' "$f" || { echo "::error file=$f::missing NEXT_PUBLIC_API_URL"; exit 1; }
          done

  build-backend:
    if: always() && (needs.dependabot-approval.result == 'success' || needs.dependabot-approval.result == 'skipped') && needs.env-files.result == 'success'
    needs: [dependabot-approval, env-files]
    name: Backend Build
    uses: ./.github/workflows/build-backend.yml
    secrets: inherit
    with:
      directory: backend/
      image: harbor.bratislava.sk/portfolio/mpp-backend
      target_unit_test: test
      target_lint: lint
      target_e2e_test: e2e

  build-frontend:
    if: always() && (needs.dependabot-approval.result == 'success' || needs.dependabot-approval.result == 'skipped') && needs.env-files.result == 'success'
    needs: [dependabot-approval, env-files]
    name: Frontend Build
    uses: ./.github/workflows/build-frontend.yml
    secrets: inherit
    with:
      directory: frontend/
      image: harbor.bratislava.sk/portfolio/mpp-frontend
